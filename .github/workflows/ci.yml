name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate versioned contracts
        run: ./tools/validate-specs.sh
      - name: Check patch whitespace
        run: git diff --check
